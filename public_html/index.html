<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">


    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pokémon Bank - Inicio de sesión</title>

    <!-- Bootstrap 4.6 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
 
 <!-- Icono del sitio -->
<link rel="icon"
      type="image/svg+xml"
      href="images/favicon.svg">   
    
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <h1 class="bank-title">
                Pokémon Bank
            </h1>

            <p class="login-subtitle">
                Bienvenido a tu cajero automático
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="pin">
                        Ingresa tu PIN de 4 dígitos
                    </label>

                    <input
                        type="password"
                        id="pin"
                        class="form-control pin-input"
                        placeholder="••••"
                        maxlength="4"
                        minlength="4"
                        pattern="[0-9]{4}"
                        inputmode="numeric"
                        autocomplete="off"
                        required
                    >
<div
    id="loginMensaje"
    class="alert alert-danger mt-3"
    role="alert"
    aria-live="polite"
    style="display: none;">
</div>
                </div>

                <button type="submit" class="btn-pokemon">
                    Ingresar
                </button>

            </form>

            <p class="login-footer">
                Pokémon Bank © 2026
                <br>
                Simulador bancario académico
            </p>

        </div>

    </main>

   
<!-- Validación de inicio de sesión -->
<script src="js/login.js"></script>
    
</body>
</html>
